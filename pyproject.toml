[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-portable"
version = "6.0"
description = "JARVIS Portable Edition — 5 agents IA locaux (MVC + Ports)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.135.1,<0.136",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "numpy>=2.4",
    "orjson>=3.11",
    "psutil>=7.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff==0.15.14",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
packages = ["agents", "config", "controllers", "graph", "models", "ports", "services"]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["--basetemp=.pytest-temp"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["services", "controllers", "agents", "graph", "ports", "config", "models"]

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["services.launcher_win"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["brotli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rapidocr"]
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.coverage.run]
omit = ["tests/*"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Cible de couverture : temporairement 0, remontée par paliers (mesuré - 2) au fil des lots TDD.
fail_under = 0
